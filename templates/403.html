{% extends "base.html" %}
{% block title %}Access denied · PrintQueue{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>403 – Access denied</h1>
  <p>You don't have permission to view this page.</p>
  {% if user.is_authenticated %}
    <a class="btn" href="{% url 'accounts:dashboard' %}">Go to my dashboard</a>
  {% else %}
    <a class="btn" href="{% url 'accounts:login' %}">Log in</a>
  {% endif %}
</div>
{% endblock %}
