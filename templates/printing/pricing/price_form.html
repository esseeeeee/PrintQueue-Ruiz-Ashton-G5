{% extends "printing/base_printing.html" %}
{% block title %}{{ title }} · PrintQueue{% endblock %}
{% block pq %}
<div class="card narrow">
  <h1>{{ title }}</h1>
  <p class="muted">Shop: <strong>{{ shop.name }}</strong></p>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "accounts/_form_fields.html" %}
    <button type="submit" class="btn">Save</button>
    <a class="btn ghost" href="{% url 'printing:shop_list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
